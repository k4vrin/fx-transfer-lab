services:
  oracle:
    image: gvenzl/oracle-free:23.26.2-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:?Set ORACLE_SYS_PASSWORD}
      APP_USER: fxtransfer
      APP_USER_PASSWORD: ${FXTRANSFER_DB_PASSWORD:?Set FXTRANSFER_DB_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  oracle-data:
